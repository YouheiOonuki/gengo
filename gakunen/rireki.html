<body>

  <header class="app-header">
    <h1>履歴書の学歴 計算（入学・卒業年）</h1>
    <p class="subtitle">入学・卒業の年月を西暦と和暦で。入力は外部に送信しません。</p>
  </header>

  <main class="app-main">

    <!-- 入力 → 結果（SCREEN.md 1.1）。生年月日と最終学歴 → 学歴の表 → 浪人・在学年数（details） -->
    <fieldset class="card">
      <legend class="visually-hidden">生年月日と最終学歴</legend>
      <div class="field-row">
        <div class="field">
          <label for="birth">生年月日（和暦でも西暦でも）</label>
          <input type="text" id="birth" autocomplete="off" placeholder="例：平成12年5月1日／2000-05-01">
        </div>
        <div class="field">
          <label for="final">最終学歴</label>
          <select id="final">
            <option value="high">高等学校</option>
            <option value="senmon">専門学校（2 年）</option>
            <option value="tandai">短期大学（2 年）</option>
            <option value="kosen">高等専門学校（5 年）</option>
            <option value="univ4" selected>大学（4 年）</option>
            <option value="univ6">大学（6 年: 医・歯・薬・獣医）</option>
            <option value="master">大学院 修士課程</option>
            <option value="doctor">大学院 博士課程（修士の後）</option>
            <option value="doctor6">大学院 博士課程（6 年制の後）</option>
          </select>
        </div>
      </div>
      <div id="rireki-result" class="result" aria-live="polite"><p class="empty">—</p></div>
    </fieldset>

    <details class="card opt" id="opt-years">
      <summary>浪人・留年: <span class="opt-state">なし</span></summary>
      <div class="field">
        <label for="ronin">浪人（高校を出てから次の学校まで）</label>
        <select id="ronin">
          <option value="0">なし</option>
          <option value="1">1 年</option>
          <option value="2">2 年</option>
          <option value="3">3 年</option>
          <option value="4">4 年</option>
          <option value="5">5 年</option>
        </select>
      </div>
      <p class="small">留年・休学・定時制などは、学校ごとの在学年数を変えます。</p>
      <div id="years" class="field-row"></div>
    </details>

    <p class="small">子どもの学年は <a href="./">学年早見表</a>へ。<a href="./guide.html">使い方・根拠・よくある質問</a></p>

  </main>
